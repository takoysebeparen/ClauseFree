[package]
name = "clausefree-legacy"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "tga"] }
bevy_egui = "0.28"
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "x11",
    "bmp",
    "png"
] }